[build]
  publish = "public"
  functions = "netlify/functions"
  command = "npm install --no-audit --no-fund"

[functions]
  node_bundler = "esbuild"

# La app y el service worker se revisan siempre para coger versiones nuevas.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
