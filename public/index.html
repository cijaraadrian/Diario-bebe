<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Diario bebé">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f2f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16181e" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px)}body{margin:0}[hidden]{display:none!important}

/* Layout: una columna móvil (máx. 560px), barra de pestañas fija abajo, banner de actividad pegado arriba, botón + flotante */
:root{
  --bg:#f6f2f1; --surface:#ffffff; --surface-2:#f0eae9; --ink:#252935; --ink-2:#5c6170; --muted:#868a96; --line:#e8e1df;
  --accent:#46589e; --accent-ink:#ffffff; --rose-soft:#f7dfe5; --rose-ink:#8c3550; --amber-soft:#faecd8; --amber-ink:#85550f;
  --c-noche:#46589e; --c-siesta:#36a6b8; --c-desp:#e06a8a; --c-toma:#c98a28; --c-none:#ece6e4; --c-neutral:#7b8194;
  --danger:#b4323f; --ok:#2f7d5b; --shadow:0 8px 28px rgba(60,40,50,.14);
  --f-display:"New York", ui-serif, "Iowan Old Style", Georgia, "Times New Roman", serif;
  --f-body:-apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --f-mono:ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  --r-lg:20px; --r-md:14px; --r-sm:10px; --nav-h:64px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#16181e; --surface:#20232b; --surface-2:#2a2d36; --ink:#ece9ef; --ink-2:#b6b9c3; --muted:#8d919d; --line:#30343e;
  --accent:#5e62c8; --accent-ink:#ffffff; --rose-soft:#3b2730; --rose-ink:#f2aec1; --amber-soft:#3a2f1e; --amber-ink:#e9bb6c;
  --c-noche:#5e62c8; --c-siesta:#28a2c2; --c-desp:#cf6386; --c-toma:#b98428; --c-none:#2b2e37; --c-neutral:#8a90a3;
  --danger:#f07c87; --ok:#6cc79c; --shadow:0 8px 28px rgba(0,0,0,.45); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#16181e; --surface:#20232b; --surface-2:#2a2d36; --ink:#ece9ef; --ink-2:#b6b9c3; --muted:#8d919d; --line:#30343e;
  --accent:#5e62c8; --accent-ink:#ffffff; --rose-soft:#3b2730; --rose-ink:#f2aec1; --amber-soft:#3a2f1e; --amber-ink:#e9bb6c;
  --c-noche:#5e62c8; --c-siesta:#28a2c2; --c-desp:#cf6386; --c-toma:#b98428; --c-none:#2b2e37; --c-neutral:#8a90a3;
  --danger:#f07c87; --ok:#6cc79c; --shadow:0 8px 28px rgba(0,0,0,.45); color-scheme:dark }

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));
  padding-block:0 calc(var(--nav-h) + 96px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.wrap{max-width:560px;margin:0 auto}
.tnum,.mono{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono)}
svg.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* Banner de actividad */
.live{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:grid;gap:8px;padding-top:10px;background:var(--bg)}
.live:empty{display:none}
.lv{background:var(--rose-soft);color:var(--rose-ink);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow)}
.lv.feed{background:var(--amber-soft);color:var(--amber-ink)}
.lv-head{display:flex;align-items:center;gap:10px;width:100%;padding:13px 16px;text-align:left}
.lv-head .t{flex:1;font-weight:600;font-size:15px}
.lv-head .clock{font-family:var(--f-mono);font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.lv-head .chev{transition:transform .2s}
.lv.open .chev{transform:rotate(180deg)}
.lv-acts{display:flex;flex-wrap:wrap;gap:8px;padding:0 12px 12px}
.lv-acts button{flex:1 1 auto;min-height:44px;padding:8px 14px;border-radius:12px;background:var(--surface);color:var(--ink);font-weight:600;font-size:14px}
.lv-acts button.pri{background:var(--accent);color:var(--accent-ink)}

/* Cabeceras */
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:22px 0 10px}
.vh h1{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1.1;margin:0;letter-spacing:-.01em;text-wrap:balance}
.eyebrow{margin:0 0 4px;color:var(--muted);font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.sub{margin:4px 0 0;color:var(--ink-2)}
h2{font-family:var(--f-display);font-size:22px;font-weight:700;margin:28px 0 12px;letter-spacing:-.005em}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;color:var(--ink)}
.icon-btn[aria-pressed="true"]{background:var(--surface-2)}

/* Tarjetas e Inicio */
.card{background:var(--surface);border-radius:var(--r-lg);padding:16px}
.now{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.stat .k{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.stat b{display:block;font-size:22px;line-height:1.2;margin:6px 0 4px;font-variant-numeric:tabular-nums}
.stat span:last-child{font-size:14px;color:var(--ink-2)}
.hint{display:inline-block;margin-top:6px;padding:3px 9px;border-radius:999px;background:var(--amber-soft);color:var(--amber-ink);font-size:13px;font-weight:600}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.qb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:92px;padding:12px 6px;border-radius:var(--r-md);background:var(--surface);font-weight:600;font-size:14px;text-align:center;line-height:1.2}
.qb .bub{width:40px;height:40px}
.qb:active{transform:scale(.97)}
.totals{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tot{background:var(--surface);border-radius:var(--r-md);padding:12px 10px}
.tot b{display:block;font-size:19px;font-variant-numeric:tabular-nums;line-height:1.2}
.tot span{font-size:12px;color:var(--muted);font-weight:600}
.syncpill{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:2px 0 6px;padding:9px 12px;border-radius:14px;font-size:14px;font-weight:600;background:var(--amber-soft);color:var(--amber-ink)}
.syncpill.bad{background:var(--rose-soft);color:var(--rose-ink)}
.syncpill .dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.syncpill button{margin-left:auto;font-weight:700;text-decoration:underline;min-height:32px}
.login-lead{margin:6px 0 0;color:var(--ink-2);max-width:42ch}
.who{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--surface-2);font-weight:700;font-size:13px;color:var(--ink)}

/* Burbujas de icono */
.bub{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none}
.cat-sueno{background:color-mix(in srgb, var(--c-noche) 15%, var(--surface));color:var(--c-noche)}
.cat-desp{background:var(--rose-soft);color:var(--c-desp)}
.cat-alim{background:var(--amber-soft);color:var(--c-toma)}
.cat-panal{background:color-mix(in srgb, var(--c-siesta) 15%, var(--surface));color:var(--c-siesta)}
.cat-evento{background:var(--surface-2);color:var(--ink-2)}

/* Controles */
.seg{display:flex;background:var(--surface-2);border-radius:999px;padding:4px;gap:4px}
.seg label{flex:1;position:relative}
.seg input{position:absolute;opacity:0;inset:0;margin:0}
.seg span{display:flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:6px 12px;border-radius:999px;font-weight:600;font-size:15px;color:var(--ink-2);text-align:center}
.seg input:checked+span{background:var(--accent);color:var(--accent-ink)}
.seg input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.seg.big span{min-height:46px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -4px;padding:2px 4px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:38px;padding:7px 14px;border-radius:999px;font-weight:600;font-size:15px;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--rose-soft);color:var(--rose-ink)}

/* Diario */
.daynav{display:flex;align-items:center;gap:6px;margin:4px 0 14px}
.daynav .dl{flex:1;position:relative;text-align:center;font-weight:700;min-height:44px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:var(--surface)}
.daynav .dl input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.daynav .icon-btn{background:var(--surface)}
.daynav .icon-btn:disabled{opacity:.35}
.status{margin:12px 0 10px;color:var(--ink-2);font-size:15px}
.tl-row{display:flex;justify-content:space-between;align-items:center;margin-top:14px}
.tz{font-size:12px;color:var(--muted)}
.tl-wrap{overflow-x:auto;margin-top:6px;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.tl{position:relative;width:100%;min-width:100%}
.tl.zoom{width:320%}
.tl .lab{font-size:13px;color:var(--muted);margin:10px 0 6px;position:sticky;left:0;display:inline-block}
.track{position:relative;height:22px;border-radius:7px;background:var(--c-none);overflow:hidden}
.track i{position:absolute;top:0;bottom:0;border-left:1px solid var(--surface);border-right:1px solid var(--surface)}
.s-noche{background:var(--c-noche)} .s-siesta{background:var(--c-siesta)} .s-desp{background:var(--c-desp)}
.track i.on{background-image:repeating-linear-gradient(135deg, transparent 0 6px, rgba(255,255,255,.28) 6px 9px)}
.feeds{position:relative;height:40px;border-bottom:1px solid var(--line)}
.fd{position:absolute;bottom:6px;transform:translateX(-50%);width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--amber-soft);color:var(--c-toma)}
.fd svg.ic{width:16px;height:16px;stroke-width:2}
.fd em{position:absolute;top:-9px;right:-11px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--rose-soft);color:var(--rose-ink);font-style:normal;font-size:11px;font-weight:700;display:grid;place-items:center}
.grid-l{position:absolute;top:0;bottom:0;width:1px;background:var(--line);pointer-events:none}
.now-l{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:2px;pointer-events:none;z-index:2}
.axis{position:relative;height:22px;margin-top:6px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.axis span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.axis span:first-child{transform:none}
.axis span:last-child{transform:translateX(-100%)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:13px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:8px;border-radius:2px;display:inline-block}
.legend svg.ic{width:15px;height:15px;color:var(--c-toma);stroke-width:2}
.summary{margin:10px 0 0;font-size:14px;color:var(--ink-2)}
.log{list-style:none;margin:10px 0 0;padding:0}
.log li+li{border-top:1px solid var(--line)}
.log button{display:flex;align-items:center;gap:14px;width:100%;padding:12px 0;text-align:left}
.log .tm{font-family:var(--f-mono);font-size:17px;font-weight:600;width:52px;flex:none;font-variant-numeric:tabular-nums}
.log .tx{min-width:0;flex:1}
.log .tx b{display:block;font-size:16px}
.log .tx span{display:block;color:var(--ink-2);font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.log .tx span.by{font-size:12.5px;color:var(--muted);font-weight:600;margin-top:1px}
.empty{padding:28px 8px;text-align:center;color:var(--muted)}

/* Análisis */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surface);border-radius:var(--r-md);padding:14px}
.kpi .k{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kpi b{display:block;font-size:24px;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;color:var(--ink-2)}
.chart{background:var(--surface);border-radius:var(--r-lg);padding:14px 12px 8px;margin-top:12px}
.chart h3{margin:0 4px 2px;font-size:16px}
.chart .read{margin:0 4px 6px;font-size:14px;color:var(--ink-2);min-height:21px;font-variant-numeric:tabular-nums}
.chart svg{display:block;width:100%;height:auto}
.chart .ax{fill:var(--muted);font-size:10px;font-family:var(--f-body)}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .hit{fill:transparent;cursor:pointer}
.chart .sel{fill:var(--surface-2)}
.foot{font-size:13px;color:var(--muted);margin-top:10px}

/* Notas y Perfil */
.field{display:grid;gap:6px;margin-bottom:14px}
.field>span{font-size:13px;font-weight:700;color:var(--ink-2)}
.inp{width:100%;min-height:46px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:16px}
.inp:focus{border-color:var(--accent);outline:none}
textarea.inp{min-height:96px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 18px;border-radius:14px;background:var(--surface-2);font-weight:700}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.dan{background:transparent;color:var(--danger);border:1.5px solid currentColor}
.btn.wide{width:100%}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.btns .btn{flex:1 1 140px}
.notes{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:10px}
.notes li{background:var(--surface);border-radius:var(--r-md);padding:14px}
.notes time{display:block;font-size:13px;color:var(--muted);font-weight:600;margin-bottom:4px}
.notes p{margin:0 0 8px;white-space:pre-wrap;overflow-wrap:anywhere}
.notes button{color:var(--danger);font-size:14px;font-weight:600;min-height:32px}
.sect{background:var(--surface);border-radius:var(--r-lg);padding:16px;margin-top:12px}
.sect h3{margin:0 0 6px;font-size:17px}
.sect p{margin:0 0 12px;color:var(--ink-2);font-size:15px}
.sect ol{margin:0;padding-left:20px;color:var(--ink-2);font-size:15px;display:grid;gap:6px}
.okchip{display:inline-block;padding:3px 10px;border-radius:999px;background:color-mix(in srgb, var(--ok) 16%, var(--surface));color:var(--ok);font-weight:700;font-size:13px}
details summary{cursor:pointer;font-weight:600;color:var(--accent);min-height:36px;display:flex;align-items:center}
.ver{text-align:center;color:var(--muted);font-size:12px;margin-top:22px}

/* Navegación y botón + */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-top:1px solid var(--line);
  padding:0 max(8px, env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(8px, env(safe-area-inset-left,0px))}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);text-decoration:none;font-size:11.5px;font-weight:600}
nav.tabs a[aria-current="page"]{color:var(--ink)}
nav.tabs a[aria-current="page"] svg{color:var(--accent)}
.fab{position:fixed;z-index:9;right:max(18px, calc(env(safe-area-inset-right,0px) + 12px));bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));
  width:62px;height:62px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:var(--shadow)}
.fab svg.ic{width:28px;height:28px;stroke-width:2}
@media (min-width:600px){ .fab{right:calc(50% - 280px + 4px)} }

/* Hoja inferior */
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(15,15,22,.42)}
.sheet[hidden]{display:none!important}
.panel{width:100%;max-width:560px;max-height:90%;overflow:auto;background:var(--bg);border-radius:24px 24px 0 0;
  padding:8px max(18px, env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px, env(safe-area-inset-left,0px));
  animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.panel-h h2{margin:0;font-size:24px}
.types{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.types button{display:flex;align-items:center;gap:12px;min-height:64px;padding:10px 12px;border-radius:var(--r-md);background:var(--surface);font-weight:600;text-align:left;line-height:1.2}
.amounts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.amounts button{min-height:38px;padding:6px 14px;border-radius:999px;background:var(--surface-2);font-weight:600}
.err{color:var(--danger);font-weight:600;font-size:14px;margin:0 0 12px}
.err:empty{display:none}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;
  background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center}

.sheet:not([hidden])~.toast{bottom:auto;top:calc(16px + env(safe-area-inset-top,0px))}
/* Paseo virtual */
.tour{position:fixed;inset:0;z-index:40}
.tour-spot{position:fixed;border-radius:18px;box-shadow:0 0 0 200vmax rgba(12,12,22,.64);transition:top .25s,left .25s,width .25s,height .25s;pointer-events:none}
.tour-card{position:fixed;left:max(12px, env(safe-area-inset-left,0px));right:max(12px, env(safe-area-inset-right,0px));margin:0 auto;max-width:520px;
  background:var(--surface);color:var(--ink);border-radius:22px;padding:18px 18px 14px;box-shadow:var(--shadow);max-height:calc(100% - 40px);overflow:auto}
.tour-card.bottom{bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.tour-card.top{top:calc(14px + env(safe-area-inset-top,0px))}
.tour-card.mid{top:50%;transform:translateY(-50%)}
.tour-step{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tour-card h2{margin:4px 0 8px;font-size:23px}
.tour-card p{margin:0 0 10px;color:var(--ink-2);font-size:15.5px}
.tour-ex{background:var(--amber-soft);color:var(--ink);border-radius:14px;padding:10px 12px;margin:0 0 10px;font-size:15px}
.tour-ex b{display:block;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--amber-ink);margin-bottom:2px}
.tour-li{list-style:none;margin:0 0 10px;padding:0;display:grid;gap:7px;font-size:15px}
.tour-li li{display:flex;gap:9px;align-items:flex-start}
.tour-li svg.ic{width:19px;height:19px;stroke-width:2.2;margin-top:1px}
.tour-li .y svg{color:var(--ok)} .tour-li .n svg{color:var(--danger)}
.tour-dots{display:flex;gap:5px;margin:4px 0 12px}
.tour-dots i{height:5px;flex:1;border-radius:3px;background:var(--line)}
.tour-dots i.on{background:var(--accent)}
.tour-nav{display:flex;gap:8px;align-items:center}
.tour-nav .skip{margin-right:auto;color:var(--muted);font-weight:600;min-height:44px;padding:0 4px}
.tour-nav .btn{min-height:44px;padding:8px 16px}
.help-btn{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:6px 12px;border-radius:999px;background:var(--surface);color:var(--ink-2);font-weight:600;font-size:14px;flex:none}
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }

/* ---------- v3: varios bebés, módulos de pago, evolución, administración ---------- */
.babybar{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:2px -4px 8px;padding:2px 4px}
.babybar::-webkit-scrollbar{display:none}
.babybar button{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:6px 14px;border-radius:999px;background:var(--surface);font-weight:700;font-size:15px;color:var(--ink-2)}
.babybar button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.babybar svg.ic{width:16px;height:16px}

.qb{position:relative}
.qb.lk{color:var(--muted)}
.qb.lk .bub{filter:grayscale(.6);opacity:.7}
.lockb{position:absolute;top:7px;right:7px;display:inline-flex;align-items:center;gap:3px;padding:2px 7px 2px 5px;border-radius:999px;background:var(--amber-soft);color:var(--amber-ink);font-size:10.5px;font-weight:800;letter-spacing:.03em;text-transform:uppercase}
.lockb svg.ic{width:11px;height:11px;stroke-width:2.4}
.types button{position:relative}
.types .lockb{top:6px;right:6px}

.locked{position:relative;border-radius:var(--r-lg);overflow:hidden}
.lk-prev{filter:blur(3px) saturate(.7);opacity:.6;pointer-events:none;user-select:none}
.lk-cta{position:absolute;inset:0;display:grid;place-items:center;padding:16px}
.lk-card{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:16px 18px;max-width:340px;text-align:center}
.lk-card .pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;background:var(--amber-soft);color:var(--amber-ink);font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
.lk-card .pill svg.ic{width:13px;height:13px;stroke-width:2.4}
.lk-card b{display:block;font-size:18px;margin:8px 0 4px}
.lk-card p{margin:0 0 12px;color:var(--ink-2);font-size:14.5px}

.upsell{display:flex;gap:12px;align-items:center;margin-top:12px;border:1.5px dashed color-mix(in srgb, var(--amber-ink) 35%, var(--line));background:var(--surface)}
.upsell .bub{width:40px;height:40px}
.upsell div{flex:1;min-width:0}
.upsell b{display:block;font-size:15px}
.upsell span{display:block;font-size:13.5px;color:var(--ink-2)}
.upsell .x{color:var(--muted);width:32px;height:32px;display:grid;place-items:center;border-radius:50%}
.upsell .go{font-weight:700;color:var(--accent);min-height:36px;padding:0 6px}
.warncard{display:flex;gap:12px;align-items:center;margin-top:12px;background:var(--rose-soft);color:var(--rose-ink)}
.warncard div{flex:1}
.warncard b{display:block}
.warncard button{font-weight:800;text-decoration:underline;min-height:36px}

.siesta-card{margin-top:10px;display:flex;gap:14px;align-items:center}
.siesta-card .bub{width:48px;height:48px}
.siesta-card .k{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.siesta-card b{display:block;font-size:21px;font-variant-numeric:tabular-nums;margin:2px 0}
.siesta-card span.d{display:block;font-size:13.5px;color:var(--ink-2)}

.cat-salud{background:color-mix(in srgb, var(--danger) 12%, var(--surface));color:var(--danger)}
.cat-bano{background:color-mix(in srgb, var(--c-siesta) 18%, var(--surface));color:var(--c-siesta)}
.cat-crec{background:color-mix(in srgb, var(--ok) 15%, var(--surface));color:var(--ok)}
.cat-hito{background:var(--amber-soft);color:var(--amber-ink)}

/* Evolución */
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:30px 0 10px}
.sec-h h2{margin:0}
.sec-h .tag{font-size:12px;font-weight:700;color:var(--muted)}
.grow-latest{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.grow-latest .tot b{font-size:18px}
.grow-latest .tot em{display:block;font-style:normal;font-size:12.5px;font-weight:700;color:var(--ok);margin-top:2px}
.g-band1{fill:var(--accent);fill-opacity:.09}
.g-band2{fill:var(--accent);fill-opacity:.15}
.g-p50{stroke:var(--accent);stroke-width:1.4;fill:none;stroke-dasharray:4 4}
.g-line{stroke:var(--ink);stroke-width:1.6;fill:none}
.g-pt{fill:var(--ink);stroke:var(--surface);stroke-width:2}
.g-lab{fill:var(--muted);font-size:10px;font-family:var(--f-body)}
.g-labr{fill:var(--accent);font-size:9.5px;font-weight:700;font-family:var(--f-body)}

.teeth svg{display:block;width:100%;max-width:360px;margin:0 auto;height:auto}
.tooth{fill:var(--surface-2);stroke:var(--muted);stroke-width:1.4;cursor:pointer}
.tooth.on{fill:var(--amber-ink);stroke:var(--amber-ink)}
.tooth:focus-visible{outline:none;stroke:var(--accent);stroke-width:3}
.t-lab{fill:var(--muted);font-size:11px;font-weight:700;font-family:var(--f-body)}
.milestones{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:10px}
.milestones li button{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border-radius:var(--r-md);padding:10px}
.milestones .ph{width:58px;height:58px;border-radius:12px;background:var(--surface-2);object-fit:cover;flex:none;display:grid;place-items:center;color:var(--muted)}
.milestones b{display:block}
.milestones span{display:block;font-size:13.5px;color:var(--ink-2)}
.photo-pick{display:flex;gap:12px;align-items:center}
.photo-pick img{width:72px;height:72px;border-radius:12px;object-fit:cover;background:var(--surface-2)}

/* Hoja de desbloqueo */
.offer{display:grid;gap:10px;margin:14px 0}
.opt{position:relative;display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;background:var(--surface);border-radius:var(--r-md);padding:14px;border:2px solid transparent}
.opt.rec{border-color:var(--accent)}
.opt .tag{position:absolute;top:-10px;left:12px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:999px}
.opt b{font-size:16px}
.opt .price{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;grid-row:span 2;align-self:center}
.opt .price small{font-size:12px;font-weight:600;color:var(--muted)}
.opt p{margin:0;font-size:13.5px;color:var(--ink-2)}
.pay{background:var(--surface-2);border-radius:var(--r-md);padding:12px 14px;font-size:15px;margin-bottom:12px}
.pay p{margin:0 0 6px}
.pay p:last-child{margin:0}
.pay .mono{font-weight:700}
.pending{display:flex;gap:8px;align-items:center;background:var(--amber-soft);color:var(--amber-ink);border-radius:12px;padding:10px 12px;font-weight:600;font-size:14px;margin-bottom:12px}
.modlist{list-style:none;padding:0;margin:0;display:grid;gap:2px}
.modlist li{display:flex;align-items:center;gap:10px;min-height:46px;border-bottom:1px solid var(--line)}
.modlist li:last-child{border-bottom:0}
.modlist .n{flex:1;font-weight:600}
.st{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:12.5px;font-weight:700;white-space:nowrap}
.st.on{background:color-mix(in srgb, var(--ok) 16%, var(--surface));color:var(--ok)}
.st.trial{background:var(--amber-soft);color:var(--amber-ink)}
.st.off{background:var(--surface-2);color:var(--muted)}
.st.exp{background:var(--rose-soft);color:var(--rose-ink)}
.linkbtn{color:var(--accent);font-weight:700;min-height:36px;padding:0 4px}
.tour-want{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:13px;font-weight:700}
.tour-want .st{font-size:12px}

/* Informe */
#report{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px, env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px))}
#report .rp{max-width:720px;margin:0 auto}
#report .rp-bar{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;margin-bottom:12px}
#report h1{font-family:var(--f-display);font-size:28px;margin:0 0 4px}
#report h3{font-size:16px;margin:18px 0 8px;padding-bottom:4px;border-bottom:1.5px solid var(--line)}
#report table{width:100%;border-collapse:collapse;font-size:14.5px;font-variant-numeric:tabular-nums}
#report td,#report th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
#report th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
#report .rp-meta{color:var(--ink-2);margin:0 0 6px}
#report .rp-foot{font-size:12px;color:var(--muted);margin-top:18px}
@media print{
  body{padding:0!important;background:#fff!important;color:#000!important}
  body>*:not(#report){display:none!important}
  #report{position:static;overflow:visible;background:#fff;color:#000;padding:0}
  #report .no-print{display:none!important}
}

/* Administración */
.adm .sect{margin-top:14px}
.adm h2{margin-top:26px}
.adm .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.adm .acc{background:var(--surface);border-radius:var(--r-lg);margin-top:10px}
.adm .acc>summary{list-style:none;display:flex;gap:10px;align-items:center;padding:14px 16px;min-height:56px;color:var(--ink)}
.adm .acc>summary::-webkit-details-marker{display:none}
.adm .acc>summary b{flex:1;min-width:0;font-size:16px}
.adm .acc>summary .mono{font-size:13px;color:var(--muted)}
.adm .acc .in{padding:0 16px 16px}
.adm .mrow{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.adm .mrow .n{font-weight:700}
.adm .mrow .acts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.sbtn{min-height:36px;padding:6px 12px;border-radius:10px;background:var(--surface-2);font-weight:700;font-size:13.5px}
.sbtn.pri{background:var(--accent);color:var(--accent-ink)}
.sbtn.dan{color:var(--danger)}
.adm .urow{padding:12px 0;border-top:1px solid var(--line)}
.adm .urow .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.adm .urow .top b{flex:1;min-width:0}
.adm .urow .mono{font-size:13px;color:var(--muted)}
.adm .ovr{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;margin-top:8px;font-size:14px}
.adm .ovr select{min-height:36px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);padding:4px 8px}
.adm .pend{background:var(--surface);border-radius:var(--r-md);padding:12px 14px;margin-top:8px;border-left:4px solid var(--amber-ink)}
.adm .pend p{margin:0 0 8px;font-size:14.5px}
.creds{background:var(--amber-soft);color:var(--ink);border-radius:var(--r-md);padding:12px 14px;margin-top:10px}
.creds p{margin:0 0 6px}
.tbl{overflow-x:auto;background:var(--surface);border-radius:var(--r-md);margin-top:8px}
.tbl table{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums;min-width:560px}
.tbl th,.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.tbl th{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media (max-width:420px){ .three{grid-template-columns:1fr 1fr} }

.lockb.dot{padding:4px;border-radius:50%}
.lockb.dot svg.ic{width:12px;height:12px}
.lk-mini .blur{filter:blur(5px);user-select:none}
.lk-mini div{flex:1;min-width:0}
.lk-mini .go{display:inline-flex;align-items:center;gap:4px;font-weight:800;color:var(--accent);min-height:40px;padding:0 6px}
.lk-mini .go svg.ic{width:15px;height:15px}
.btncol{display:grid;gap:10px}
nav.tabs[hidden]{display:none!important}
#report th[scope=row]{width:55%}

</style>

const nightMin=hm=>{const[h,m]=hm.split(':').map(Number);return h*60+m};
function isNight(t){const s=settings(),d=new Date(t),m=d.getHours()*60+d.getMinutes(),a=nightMin(s.nightStart),b=nightMin(s.nightEnd);return a>b?(m>=a||m<b):(m>=a&&m<b)}
function nightWindow(day){const s=settings(),a=nightMin(s.nightStart),b=nightMin(s.nightEnd);
  return a>b?[atHM(addDays(day,-1),s.nightStart),atHM(day,s.nightEnd)]:[atHM(day,s.nightStart),atHM(day,s.nightEnd)]}
const running=()=>evs().filter(e=>e.end==null&&(e.type==='sueno'||e.type==='despertar'||e.type==='pecho')).sort((a,b)=>a.start-b.start);
function nightStats(def){const b=def.start;
  const sl=evs().filter(e=>e.type==='sueno'&&e.sub==='noche'&&e.start<b&&evEnd(e)<=b+MIN&&evEnd(e)>b-16*H).sort((x,y)=>evEnd(y)-evEnd(x));
  let cur=b,used=[];for(const e of sl){if(evEnd(e)>=cur-3*H&&e.start<cur){used.push(e);cur=Math.min(cur,e.start)}else if(evEnd(e)<cur-3*H)break}
  if(!used.length)return null;const slept=used.reduce((s,e)=>s+ov(e.start,evEnd(e),cur,b),0);return{slept,inBed:b-cur}}
function rangeStats(a,b,list){
  let night=0,nap=0,awake=0,wakes=0,feeds=0,ml=0,diapers=0,pis=0,caca=0,breast=0,bottle=0,baths=0;
  for(const e of list||evs()){const en=evEnd(e);const T=TYPES[e.type];if(!T)continue;
    if(e.type==='sueno'){const o=ov(e.start,en,a,b);if(e.sub==='noche')night+=o;else nap+=o}
    else if(e.type==='despertar'){if(e.start>=a&&e.start<b){wakes++;awake+=ov(e.start,en,a,b)}}
    else if(T.cat==='alim'){if(e.start>=a&&e.start<b){feeds++;if(e.type==='biberon'){bottle++;ml+=+e.qty||0}if(e.type==='pecho')breast++}}
    else if(e.type==='panal'){if(e.start>=a&&e.start<b){diapers++;if(e.sub!=='caca')pis++;if(e.sub!=='pis')caca++}}
    else if(e.type==='bano'){if(e.start>=a&&e.start<b)baths++}
  }
  return{night,nap,sleep:night+nap,awake,wakes,feeds,ml,diapers,pis,caca,breast,bottle,baths};
}
function evTitle(e){if(e.type==='sueno')return e.sub==='noche'?'Sueño nocturno':'Siesta';if(e.type==='evento')return ECATS_ALL[e.sub]||'Salud';if(e.type==='hito')return e.title||'Hito';if(e.type==='diente')return'Diente';return TYPES[e.type]?.label||e.type}
function evDetail(e){
  const run=e.end==null;
  switch(e.type){
    case'sueno':return run?`Durmiendo desde las ${fmtTime(e.start)}`:`${fmtTime(e.start)} – ${fmtTime(e.end)} · ${fmtDur(e.end-e.start)}`;
    case'despertar':return run?'Despierto ahora':`despierto ${fmtDur(e.end-e.start)}`;
    case'despertar_def':{const s=nightStats(e);return s?`${fmtDur(s.slept)} dormidos · ${fmtDur(s.inBed)} en cama`:'Fin de la noche'}
    case'pecho':return SIDES[e.sub]+(run?' · en curso':(e.end>e.start?' · '+fmtDur(e.end-e.start):''));
    case'biberon':return`${e.qty} ml · ${MILK[e.sub]||''}`;
    case'comida':return e.note||'';
    case'panal':return DIAPER[e.sub]+(e.note?' · '+e.note:'');
    case'bano':return[e.temp?`Agua a ${num1(e.temp)} °C`:'',e.note||''].filter(Boolean).join(' · ');
    case'evento':return e.note||'';
    case'medida':return[e.peso?`${num1(e.peso)} kg`:'',e.talla?`${num1(e.talla)} cm`:'',e.cabeza?`cabeza ${num1(e.cabeza)} cm`:''].filter(Boolean).join(' · ');
    case'hito':return e.note||'';
    case'diente':return e.tooth?toothName(e.tooth):'';
  }return''}
function ageDays(b,t=Date.now()){const bd=b&&fromDateInput(b.birth);return bd==null?null:Math.floor((midnight(t)-bd)/DAY)}
function ageText(b){const days=ageDays(b);if(days==null||days<0)return'';
  if(days<91){const w=Math.floor(days/7),d=days%7;return w?`${w} ${w===1?'semana':'semanas'}${d?` y ${d} ${d===1?'día':'días'}`:''}`:`${days} ${days===1?'día':'días'}`}
  const bd=new Date(fromDateInput(b.birth)),nd=new Date();let m=(nd.getFullYear()-bd.getFullYear())*12+nd.getMonth()-bd.getMonth();if(nd.getDate()<bd.getDate())m--;return`${m} meses`}

async function api(path,opts={}){
  const h={'content-type':'application/json'};const tok=opts.admin?D.adminToken:D.token;if(tok)h.authorization='Bearer '+tok;
  const r=await fetch('/api/'+path,{method:opts.method||'GET',headers:h,body:opts.body!==undefined?JSON.stringify(opts.body):undefined,cache:'no-store'});

  return d;
}

/* ---------- Sincronización ---------- */
const BATCH=300;
const sy={state:'idle',last:0,busy:false,again:false,fail:0,timer:null,soon:null};
function syncSoon(ms=400){clearTimeout(sy.soon);sy.soon=setTimeout(sync,ms)}
async function sync(){
  if(ADMIN||!D.token)return;
  if(sy.busy){sy.again=true;return}
  sy.busy=true;const ops=S.outbox.slice(0,BATCH);
  try{
    const d=await api('sync?since='+S.rev,ops.length?{method:'POST',body:{ops}}:{});
    if(ops.length)S.outbox=S.outbox.filter(o=>!ops.includes(o));
    let changed=applyRemote(d);
    if(d.me){const before=JSON.stringify(S.me);S.me=d.me;if(JSON.stringify(d.me)!==before)changed=true}
    if(d.rejected&&d.rejected.length){toast('Algún cambio no se guardó porque tu cuenta no lo incluye');S.rev=-1;sy.again=true;changed=true}
    if(S.block){S.block=null;changed=true}
    sy.state='ok';sy.last=Date.now();sy.fail=0;save();
    if(changed)refresh();
    if(S.outbox.length)sy.again=true;
  }catch(e){
    if(e.status===401)sy.state='auth';
    else if(e.status===403){S.block={code:e.code,message:e.message};sy.state='blocked';save();refresh()}
    else sy.state=navigator.onLine===false?'offline':'error';
    sy.fail++}
  sy.busy=false;renderSync();
  if(sy.again&&sy.state==='ok'){sy.again=false;syncSoon(50)}else sy.again=false;
}
function pendingItem(k,id){const o=S.outbox.find(o=>o.k===k&&o.item.id===id);return o?o.item:null}
function mergeInto(list,k,it){
  const mine=pendingItem(k,it.id);if(mine&&mine.updated>it.updated)return false;
  const c={...it};delete c._rev;const i=list.findIndex(x=>x.id===c.id);
  if(c.deleted){if(i>=0){list.splice(i,1);return true}return false}
  if(i>=0){if(list[i].updated===c.updated&&list[i].by===c.by)return false;list[i]=c;return true}
  list.push(c);return true;
}
function applyRemote(d){
  let ch=false;
  if(d.full){
    const keep=(list,k,arr)=>{const ids=new Set(arr.map(x=>x.id));const n=list.length;const out=list.filter(x=>ids.has(x.id)||pendingItem(k,x.id));if(out.length!==n)ch=true;return out};
    S.events=keep(S.events,'ev',d.events||[]);S.notes=keep(S.notes,'note',d.notes||[]);S.babies=keep(S.babies,'baby',d.babies||[]);
  }
  for(const it of d.events||[])ch=mergeInto(S.events,'ev',it)||ch;
  for(const it of d.notes||[])ch=mergeInto(S.notes,'note',it)||ch;
  for(const it of d.babies||[])ch=mergeInto(S.babies,'baby',it)||ch;
  if(d.settings){const mine=pendingItem('settings','settings');if(!mine||mine.updated<=d.settings.updated){const p=Object.assign(defaultSettings(),d.settings);delete p._rev;
    if(JSON.stringify(p)!==JSON.stringify(S.settings)){S.settings=p;ch=true}}}
  if(typeof d.rev==='number')S.rev=d.rev;
  return ch;
}
function busyEditing(){const a=document.activeElement;return a&&a.closest&&a.closest('#view')&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)}
function refresh(){if(ADMIN||!D.token)return;if(tour||!$('#sheet').hidden||!$('#report').hidden||busyEditing()){ui.dirty=true;renderLive();return}ui.dirty=false;render()}
function loop(){clearTimeout(sy.timer);if(!D.token||ADMIN)return;
  const wait=document.visibilityState!=='visible'?60000:sy.fail?Math.min(60000,4000*2**Math.min(sy.fail,4)):8000;
  sy.timer=setTimeout(async()=>{if(document.visibilityState==='visible')await sync();loop()},wait)}
function agoText(t){const s=Math.round((Date.now()-t)/1000);return s<10?'ahora mismo':s<60?`hace ${s} s`:`hace ${fmtDur(Date.now()-t)}`}
function syncPill(){

/* ---------- Próxima siesta ---------- */
// Ventanas de vigilia orientativas por edad (minutos). Fuente: tablas publicadas por Napper y Taking Cara Babies.
const WAKE=[[0,28,35,60],[28,84,60,90],[84,150,75,120],[150,225,120,180],[225,320,150,210],[320,440,180,240],[440,99999,240,360]];
function napPrediction(){
  const b=curBaby(),days=ageDays(b);if(days==null||days<0)return{need:'birth'};
  const w=WAKE.find(x=>days>=x[0]&&days<x[1]);const lo=w[2]*MIN,hi=w[3]*MIN;
  const sl=evs().filter(e=>e.type==='sueno').sort((a,c)=>a.start-c.start);
  const cur=sl.find(e=>e.end==null);if(cur)return{sleeping:true,lo,hi};
  const last=sl[sl.length-1];const now=Date.now();
  const gaps=[];for(let i=1;i<sl.length;i++){const a=sl[i-1],c=sl[i];if(a.end==null||c.start<now-3*DAY)continue;const g=c.start-a.end;if(g>20*MIN&&g<6*H&&!isNight(a.end)&&!isNight(c.start))gaps.push(g)}
  const rec=gaps.slice(-6).sort((x,y)=>x-y);const med=rec.length>=3?rec[Math.floor(rec.length/2)]:null;
  const target=med?Math.min(hi,Math.max(lo,med)):(lo+hi)/2;
  if(!last)return{noData:true,lo,hi};
  const wake=last.end;const from=Math.max(now,wake+target-15*MIN),to=Math.max(from+15*MIN,wake+target+15*MIN);
  return{wake,from,to,lo,hi,med,target,awake:now-wake,night:isNight(from)};
}
function siestaCard(){
  if(!has('siesta'))return`<div id="siesta-card" class="card siesta-card lk-mini"><span class="bub cat-sueno">${ic('clock')}</span><div><span class="k">Próxima siesta · Premium</span><b class="tnum blur">11:40 – 12:10</b><span class="d">Te digo a qué hora le toca dormir según su edad y cómo duerme.</span></div><button class="go" data-act="unlock" data-mod="siesta">${ic('lock')}Ver</button></div>`;
  const p=napPrediction();let b='',d='';
  const rng=`${fmtDur(p.lo)} y ${fmtDur(p.hi)}`;
  if(p.need==='birth'){b='Falta la fecha de nacimiento';d='Añádela en Perfil para calcularlo.'}
  else if(p.sleeping){b='Está durmiendo';d='Cuando se despierte calcularé la siguiente.'}

  else{b=`${fmtTime(p.from)} – ${fmtTime(p.to)}`;d=`Lleva ${fmtDur(p.awake)} despierto. A su edad suele aguantar entre ${rng}${p.med?`; estos días, unos ${fmtDur(p.med)}`:''}.`}
  return`<div id="siesta-card" class="card siesta-card"><span class="bub cat-sueno">${ic('clock')}</span><div><span class="k">Próxima siesta · orientativo</span><b class="tnum">${b}</b><span class="d">${esc(d)}</span></div></div>`;
}

function timeline(a,b){

    const c=e.type==='despertar'?'desp':e.sub;segs+=`<i class="s-${c}${e.end==null?' on':''}" style="left:${pct(s)}%;width:${Math.max((en-s)/span*100,.5).toFixed(3)}%"></i>`}
  const fe=E.filter(e=>TYPES[e.type]?.cat==='alim'&&e.start>=a&&e.start<b).sort((x,y)=>x.start-y.start);
  const cl=[];for(const e of fe){const l=cl[cl.length-1];if(l&&e.start-l.t<30*MIN&&!ui.zoom)l.n.push(e);else cl.push({t:e.start,n:[e]})}
  icons=cl.map(c=>`<span class="fd" style="left:${pct(c.t)}%" title="${fmtTime(c.t)}">${ic(TYPES[c.n[0].type].icon)}${c.n.length>1?`<em>${c.n.length}</em>`:''}</span>`).join('');

  else{const st=Math.ceil(a/H)*H;for(let t=st;t<b-H;t+=3*H)ticks.push({t,l:fmtTime(t)});ticks.unshift({t:a,l:fmtTime(a)});ticks=ticks.filter((x,i,arr)=>i===0||x.t-arr[i-1].t>=H);ticks.push({t:b,l:fmtTime(b)})}
  if(ui.zoom&&ui.mode==='24h'){const d=new Date(a);ticks=[];for(let h=0;h<=24;h+=2)ticks.push({t:new Date(d.getFullYear(),d.getMonth(),d.getDate(),h).getTime(),l:pad(h)+':00'})}

   <div class="axis">${ticks.map(x=>`<span style="left:${pct(x.t)}%">${x.l}</span>`).join('')}</div></div></div>`;
}

function bars(id,days,series,fmt,unitMax){
  const W=340,Hh=150,L=30,R=6,T=8,B=22,pw=W-L-R,ph=Hh-T-B,n=days.length;
  const tot=days.map((_,i)=>series.reduce((s,x)=>s+x.vals[i],0));
  let mx=Math.max(unitMax||1,...tot);const step=[1,2,4,5,10,20,25,50,100].find(s=>mx/s<=4)||Math.ceil(mx/4);mx=Math.ceil(mx/step)*step;

  });

function sampleEvents(){ // Datos de ejemplo SOLO para las vistas previas bloqueadas; nunca se guardan.
  const out=[];const today=midnight(Date.now());let r=7;const rnd=()=>{r=(r*16807)%2147483647;return r/2147483647};

    out.push({type:'sueno',sub:'noche',start:atHM(addDays(d,-1),'20:30'),end:atHM(d,'07:30')+rnd()*40*MIN});

    const w=1+Math.floor(rnd()*3);for(let i=0;i<w;i++){const s=atHM(d,'02:00')+i*2*H;out.push({type:'despertar',start:s,end:s+15*MIN})}

    for(let i=0;i<5+Math.floor(rnd()*3);i++)out.push({type:'panal',sub:'pis',start:d+i*3*H,end:d+i*3*H});
  }return out}

/* ---------- Crecimiento (curvas OMS) ---------- */
const ZP={3:-1.880794,15:-1.036433,50:0,85:1.036433,97:1.880794};
function lmsAt(kind,sex,day){const t=WHO_LMS[kind][sex==='f'?'2':'1'];if(day<=0)return t[0].slice(1);if(day>=t[t.length-1][0])return t[t.length-1].slice(1);
  let i=Math.floor(day/7);if(i>=t.length-1)i=t.length-2;const a=t[i],b=t[i+1],f=(day-a[0])/(b[0]-a[0]);return[1,2,3].map(k=>a[k]+(b[k]-a[k])*f)}
const valAtZ=([L,M,Sv],z)=>L?M*Math.pow(1+L*Sv*z,1/L):M*Math.exp(Sv*z);
const zOf=([L,M,Sv],x)=>L?(Math.pow(x/M,L)-1)/(L*Sv):Math.log(x/M)/Sv;
function normCdf(z){const t=1/(1+.3275911*Math.abs(z)/Math.SQRT2),y=1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-.284496736)*t+.254829592)*t*Math.exp(-z*z/2);return z>=0?(1+y)/2:(1-y)/2}
function pctText(kind,sex,day,x){if(day<0||day>730||!x)return'';const p=normCdf(zOf(lmsAt(kind,sex,day),x))*100;return p<1?'percentil <1':p>99?'percentil >99':`percentil ${Math.round(p)}`}
const GK={peso:{label:'Peso',unit:'kg',field:'peso'},talla:{label:'Talla',unit:'cm',field:'talla'},cabeza:{label:'Cabeza',unit:'cm',field:'cabeza'}};
function growthChart(kind,sex,pts,nowDay){
  const W=340,Hh=210,L=34,R=30,T=10,B=24,pw=W-L-R,ph=Hh-T-B;
  const maxPt=pts.length?Math.max(...pts.map(p=>p.d)):0;
  const xMax=Math.min(730,Math.max(182,Math.ceil((Math.max(maxPt,nowDay||0)+45)/30.4375)*30.4375));
  const xs=[];for(let d=0;d<=xMax;d+=7)xs.push(d);if(xs[xs.length-1]!==xMax)xs.push(xMax);
  const band=z=>xs.map(d=>valAtZ(lmsAt(kind,sex,d),z));
  const p3=band(ZP[3]),p15=band(ZP[15]),p50=band(0),p85=band(ZP[85]),p97=band(ZP[97]);
  let lo=Math.min(...p3,...pts.map(p=>p.v)),hi=Math.max(...p97,...pts.map(p=>p.v));
  const step=[.5,1,2,5,10].find(s=>(hi-lo)/s<=6)||10;lo=Math.floor(lo/step)*step;hi=Math.ceil(hi/step)*step;
  const X=d=>L+d/xMax*pw,Y=v=>T+ph-(v-lo)/(hi-lo)*ph;
  const poly=(top,bot)=>xs.map((d,i)=>`${X(d).toFixed(1)},${Y(top[i]).toFixed(1)}`).join(' ')+' '+xs.map((d,i)=>[d,i]).reverse().map(([d,i])=>`${X(d).toFixed(1)},${Y(bot[i]).toFixed(1)}`).join(' ');
  let g='';for(let v=lo;v<=hi+1e-9;v+=step)g+=`<line class="gl" x1="${L}" x2="${L+pw}" y1="${Y(v)}" y2="${Y(v)}"/><text class="g-lab" x="${L-5}" y="${Y(v)+3.5}" text-anchor="end">${num1(v)}</text>`;
  const months=Math.round(xMax/30.4375),mstep=months<=8?1:months<=16?2:3;
  for(let m=0;m<=months;m+=mstep){const d=m*30.4375;if(d>xMax+1)break;g+=`<text class="g-lab" x="${X(d)}" y="${Hh-6}" text-anchor="middle">${m} m</text>`}
  const line=pts.length>1?`<polyline class="g-line" points="${pts.map(p=>`${X(p.d).toFixed(1)},${Y(p.v).toFixed(1)}`).join(' ')}"/>`:'';
  const dots=pts.map(p=>`<circle class="g-pt" cx="${X(p.d).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="4.5"/>`).join('');
  const lastI=xs.length-1;
  const labs=[[p97,'P97'],[p50,'P50'],[p3,'P3']].map(([a,t])=>`<text class="g-labr" x="${L+pw+4}" y="${Y(a[lastI])+3.5}">${t}</text>`).join('');
  return`<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="${GK[kind].label} sobre las curvas de la OMS">${g}<polygon class="g-band1" points="${poly(p97,p3)}"/><polygon class="g-band2" points="${poly(p85,p15)}"/><polyline class="g-p50" points="${xs.map((d,i)=>`${X(d).toFixed(1)},${Y(p50[i]).toFixed(1)}`).join(' ')}"/>${line}${dots}${labs}</svg>`;
}

const UP=['UR5','UR4','UR3','UR2','UR1','UL1','UL2','UL3','UL4','UL5'],LOW=['LR5','LR4','LR3','LR2','LR1','LL1','LL2','LL3','LL4','LL5'];
function teethSVG(map){
  const tooth=(c,ang,cx,cy,rx,ry)=>{const a=ang*Math.PI/180,x=cx+rx*Math.cos(a),y=cy+ry*Math.sin(a),n=+c[2],w=n>=4?13:n===3?10:9,h=n>=4?12:14;
    const on=!!map[c];return`<rect class="tooth ${on?'on':''}" data-act="tooth" data-t="${c}" tabindex="0" role="button" aria-label="${toothName(c)}${on?', salió el '+fmtD(map[c].start):''}" x="${(x-w).toFixed(1)}" y="${(y-h).toFixed(1)}" width="${2*w}" height="${2*h}" rx="${n>=4?6:9}" transform="rotate(${(ang+90).toFixed(1)} ${x.toFixed(1)} ${y.toFixed(1)})"/>`};
  let s='';UP.forEach((c,i)=>{s+=tooth(c,190+i*160/9,180,148,138,104)});LOW.forEach((c,i)=>{s+=tooth(c,170-i*160/9,180,172,138,104)});

const val=id=>{const n=document.getElementById(id);return n?n.value.trim():''};
const numv=id=>{const v=val(id).replace(',','.');if(v==='')return null;const n=+v;return Number.isFinite(n)?n:NaN};
const radio=n=>{const x=document.querySelector(`#evform input[name="${n}"]:checked`);return x?x.value:null};
function submitForm(timer){
  const err=m=>{$('#f-err').textContent=m};const type=formType;const T=TYPES[type];
  if(!editing&&!guard(T.mod))return;
  let start;
  if(type==='medida'||type==='hito'){const d=fromDateInput(val('f-date'));if(d==null)return err('Indica la fecha.');start=d+12*H}
  else{start=fromLocalInput(val('f-start'));if(timer)start=Date.now();if(start==null)return err('Indica la hora.')}
  if(start>Date.now()+5*MIN&&type!=='medida'&&type!=='hito')return err('La hora no puede estar en el futuro.');
  if((type==='medida'||type==='hito')&&start-12*H>Date.now())return err('La fecha no puede estar en el futuro.');
  const o={type,start};
  if(type==='sueno'){o.sub=radio('sub');const en=val('f-end');o.end=timer||!en?null:fromLocalInput(en);if(o.end!=null&&o.end<=start)return err('La hora de despertar debe ser posterior a la de dormir.');
    if(o.end==null&&running().some(e=>e.type==='sueno'&&(!editing||e.id!==editing.id)))return err('Ya hay un sueño en curso. Termínalo primero.')}
  else if(type==='despertar'){const m=val('f-min');o.end=timer||m===''?null:start+Math.max(0,+m)*MIN}
  else if(type==='despertar_def'){o.end=start}
  else if(type==='pecho'){o.sub=radio('sub');const m=val('f-min');o.end=timer?null:(m===''?start:start+Math.max(0,+m)*MIN)}
  else if(type==='biberon'){const q=+val('f-qty');if(!(q>0))return err('Indica la cantidad en ml.');o.qty=Math.round(q);o.sub=radio('sub');o.end=start}
  else if(type==='comida'){o.note=val('f-note');if(!o.note)return err('Escribe qué ha comido.');o.end=start}
  else if(type==='panal'){o.sub=radio('sub');o.note=val('f-note');o.end=start}
  else if(type==='bano'){const tp=numv('f-temp');if(Number.isNaN(tp))return err('Escribe la temperatura con números, por ejemplo 37 o 36,5.');if(tp!=null&&(tp<20||tp>45))return err('La temperatura del agua parece incorrecta.');o.temp=tp;o.note=val('f-note');o.end=start}
  else if(type==='evento'){o.sub=val('f-cat');o.note=val('f-note');if(!o.note)return err('Escribe una descripción.');o.end=start}
  else if(type==='medida'){o.peso=numv('f-peso');o.talla=numv('f-talla');o.cabeza=numv('f-cabeza');o.end=start;
    if([o.peso,o.talla,o.cabeza].some(Number.isNaN))return err('Escribe las medidas con números, por ejemplo 5,4.');
    if(o.peso==null&&o.talla==null&&o.cabeza==null)return err('Rellena al menos una medida.');
    if(o.peso!=null&&(o.peso<.5||o.peso>30))return err('El peso va en kilos, por ejemplo 5,4.');
    if(o.talla!=null&&(o.talla<30||o.talla>120))return err('La talla va en centímetros, por ejemplo 58.');
    if(o.cabeza!=null&&(o.cabeza<20||o.cabeza>60))return err('El perímetro de cabeza va en centímetros, por ejemplo 39.')}
  else if(type==='hito'){const sel=val('f-title');o.title=sel==='__otro'?val('f-other'):sel;if(!o.title)return err('Escribe el hito.');o.note=val('f-note');o.photo=formPhoto;o.end=start}
  if(editing){upd(editing,o);toast('Cambios guardados')}
  else{
    if(type==='despertar'&&o.end==null)running().filter(e=>e.type==='sueno').forEach(e=>upd(e,{end:start}));
    if(type==='despertar_def'){running().forEach(e=>{if(e.type!=='pecho'&&e.start<=start)upd(e,{end:start})})}
    if(type==='pecho'&&o.end==null)running().filter(e=>e.type==='pecho').forEach(e=>upd(e,{end:start}));
    addEv(o);toast(timer?'Cronómetro en marcha':'Registro guardado')}
  closeSheet();render();
}

const imgCache=new Map();
async function hydrateImages(){
  for(const el of document.querySelectorAll('img[data-img]')){const id=el.dataset.img;if(!id)continue;
    if(imgCache.has(id)){el.src=imgCache.get(id);el.hidden=false;continue}
    try{const r=await api('img/'+encodeURIComponent(id));imgCache.set(id,r.data);document.querySelectorAll(`img[data-img="${CSS.escape(id)}"]`).forEach(n=>{n.src=r.data;n.hidden=false})}catch(e){}}
}
function resizeImage(file,max=1080,q=.78){return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const im=new Image();
  im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',q))};
  im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('img'))};im.src=url})}
async function pickPhoto(file){
  const errEl=$('#f-err');try{
    const data=await resizeImage(file);const id=uid('ph_');errEl.textContent='Subiendo foto…';
    await api('img/'+id,{method:'PUT',body:{data}});imgCache.set(id,data);formPhoto=id;const im=$('#f-ph');im.src=data;im.hidden=false;errEl.textContent='';
  }catch(e){errEl.textContent=e.status?e.message:'No se pudo subir la foto. Necesitas conexión a internet.'}}

function openReport(){
  if(!has('informe'))return openUnlock('informe');
  const b=curBaby();if(!b)return;
  const days=14,today=midnight(Date.now()),from=addDays(today,-days),to=today;
  const per=[];for(let d=from;d<to;d=addDays(d,1))per.push(rangeStats(d,addDays(d,1)));
  const nights=[];for(let d=addDays(from,1);d<=to;d=addDays(d,1)){const[a,c]=nightWindow(d);nights.push(rangeStats(a,c))}
  const av=f=>per.length?per.reduce((s,x)=>s+f(x),0)/per.length:0;const avn=f=>nights.length?nights.reduce((s,x)=>s+f(x),0)/nights.length:0;
  const E=evs();const inRange=e=>e.start>=from&&e.start<addDays(to,1);
  const health=E.filter(e=>e.type==='evento'&&inRange(e)).sort((a,c)=>c.start-a.start);
  const meds=E.filter(e=>e.type==='medida').sort((a,c)=>c.start-a.start).slice(0,4);
  const hit=E.filter(e=>(e.type==='hito'||e.type==='diente')&&e.start>=addDays(today,-60)).sort((a,c)=>c.start-a.start);
  const ns=notes().filter(n=>n.t>=addDays(today,-30)).sort((a,c)=>c.t-a.t).slice(0,10);
  const bd=fromDateInput(b.birth);
  const row=(k,v)=>`<tr><th scope="row">${k}</th><td>${v}</td></tr>`;
  const sleepRows=row('Sueño total al día',fmtH(av(s=>s.sleep)))+row('Noche',fmtH(av(s=>s.night)))+row('Siestas',fmtH(av(s=>s.nap)))+row('Despertares por noche',num1(avn(s=>s.wakes))+` (${fmtDur(avn(s=>s.awake))} despierto)`);
  const feedRows=row('Tomas al día',num1(av(s=>s.feeds)))+row('Pecho al día',num1(av(s=>s.breast)))+row('Biberones al día',num1(av(s=>s.bottle))+(av(s=>s.ml)?` · ${Math.round(av(s=>s.ml))} ml`:''));
  const diaperRows=row('Pañales al día',num1(av(s=>s.diapers)))+row('Con pis',num1(av(s=>s.pis)))+row('Con caca',num1(av(s=>s.caca)));
  $('#report').innerHTML=`<div class="rp"><div class="rp-bar no-print"><button class="btn" data-act="report-close">${ic('close')}Cerrar</button><button class="btn pri" data-act="print">${ic('report')}Imprimir o guardar PDF</button></div>
   <h1>${esc(b.name)}</h1><p class="rp-meta">${b.birth?`Nacimiento: ${fmtD(bd)} · ${ageText(b)} · `:''}Del ${fmtD(from)} al ${fmtD(addDays(to,-1))} (${days} días)</p>
   <h3>Sueño · media diaria</h3><table>${sleepRows}</table>
   ${has('tomas')||E.some(e=>e.type==='pecho'||e.type==='biberon')?`<h3>Alimentación · media diaria</h3><table>${feedRows}</table>`:''}
   ${has('panales')||E.some(e=>e.type==='panal')?`<h3>Pañales · media diaria</h3><table>${diaperRows}</table>`:''}
   ${meds.length?`<h3>Crecimiento</h3><table><tr><th>Fecha</th><th>Peso</th><th>Talla</th><th>Cabeza</th></tr>${meds.map(m=>{const d=Math.round((midnight(m.start)-bd)/DAY);const p=(f,u)=>m[f]?`${num1(m[f])} ${u}${b.sex&&bd?`<br><small>${pctText(f,b.sex,d,+m[f])}</small>`:''}`:'—';return`<tr><td>${fmtD(m.start)}</td><td>${p('peso','kg')}</td><td>${p('talla','cm')}</td><td>${p('cabeza','cm')}</td></tr>`}).join('')}</table>`:''}
   ${health.length?`<h3>Salud en el periodo</h3><table>${health.map(e=>`<tr><td>${fmtD(e.start)} ${fmtTime(e.start)}</td><td><b>${esc(ECATS_ALL[e.sub]||'Salud')}</b> · ${esc(e.note||'')}</td></tr>`).join('')}</table>`:''}
   ${hit.length?`<h3>Hitos recientes</h3><table>${hit.map(e=>`<tr><td>${fmtD(e.start)}</td><td>${esc(e.type==='diente'?'Diente: '+toothName(e.tooth):e.title)}</td></tr>`).join('')}</table>`:''}
   ${ns.length?`<h3>Notas y preguntas</h3><table>${ns.map(n=>`<tr><td>${fmtD(n.t)}</td><td>${esc(n.text)}</td></tr>`).join('')}</table>`:''}
   <p class="rp-foot">Generado con Diario del bebé el ${fmtD(Date.now())}. Datos apuntados por la familia; las medias excluyen el día de hoy. Percentiles según los patrones de crecimiento de la OMS.</p></div>`;
  $('#report').hidden=false;document.body.style.overflow='hidden';
}

  ui.pendingImport={events:evs2,notes:Array.isArray(d.notes)?d.notes.filter(n=>n&&n.id&&n.text):[]}}

function applyImport(){const p=ui.pendingImport,b=curBaby();if(!p||p.error||!b)return;const now=Date.now();let n=0,skip=0;
  for(const e of p.events){if(S.events.some(x=>x.id===e.id))continue;if(!has(TYPES[e.type].mod)){skip++;continue}const it={...e,baby:b.id,updated:e.updated||now};delete it.demo;delete it._rev;delete it.by;delete it.uid;S.events.push(it);S.outbox.push({k:'ev',item:it});n++}
  if(has('notas'))for(const x of p.notes){if(S.notes.some(y=>y.id===x.id))continue;const it={...x,baby:b.id,updated:x.updated||now};delete it._rev;S.notes.push(it);S.outbox.push({k:'note',item:it});n++}
  ui.pendingImport=null;save();syncSoon(50);toast(n?`${n} registros añadidos${skip?` · ${skip} necesitan módulos que no tienes`:''}`:'No había nada nuevo');render()}

let tour=null,TOUR=[];

function endTour(){tour=null;$('#tour').hidden=true;document.body.style.overflow='';ui.dirty=false;render()}
function tourGo(d){const n=tour.i+d;if(n<0)return;if(n>=TOUR.length)return endTour();tour.i=n;tour.dir=d;showStep()}

async function adminActivate(accId,mod,n,paymentId){
  const d=A.data,cfg=d.config,prices=cfg.prices||{module:1,all:20};const acc=d.accounts.find(a=>a.id===accId);const now=Date.now();
  if(n==='forever')return aop('activate',{accountId:accId,module:mod,from:now,until:null,amount:prices.all,kind:'pago',paymentId},'Activado para siempre');
  if(n==='trial'){const until=addDays(now,cfg.trialDays||7);return aop('activate',{accountId:accId,module:mod,from:now,until,amount:0,kind:'prueba',paymentId},'Prueba activada')}
  const months=+n;const cur=mod!=='all'&&acc.mods[mod];const from=cur&&activeM(cur)&&cur.until?cur.until:now;
  return aop('activate',{accountId:accId,module:mod,from,until:addMonths(from,months),amount:prices.module*months,kind:'pago',paymentId},`Activado hasta ${fmtD(addMonths(from,months))}`);
}

    return}
  if(f.id==='pwform'){const cur=$('#pw-cur').value,nx=$('#pw-new').value,rep=$('#pw-rep'),err=$('#pw-err');
    if(nx.length<8){err.textContent='La nueva contraseña necesita al menos 8 caracteres.';return}
    if(rep&&rep.value!==nx){err.textContent='Las dos contraseñas nuevas no coinciden.';return}
    try{const r=await api('password',{method:'POST',body:{current:cur,next:nx}});D.token=r.token;saveD();if(S.me?.user)S.me.user.mustChange=false;save();toast('Contraseña cambiada');render();
      if(f.dataset.force&&!D.tourSeen&&curBaby())setTimeout(startTour,400)}
    catch(x){err.textContent=x.status?x.message:'Sin conexión. Inténtalo con internet.'}
    return}
  /* administración */
  if(f.id==='adminlogin'){const err=$('#a-err'),go=$('#a-go');go.disabled=true;
    try{const r=await api('admin/login',{method:'POST',body:{username:val('a-user'),password:$('#a-pass').value}});D.adminToken=r.token;saveD();await adminLoad()}
    catch(x){err.textContent=x.message;go.disabled=false}return}
  if(f.id==='a-newfam'){const F=new FormData(f),err=$('#a-nferr');const acc=String(F.get('acc')||'').trim(),name=String(F.get('name')||'').trim(),username=String(F.get('username')||'').trim().toLowerCase(),password=String(F.get('password')||'');
    if(!acc||!name||!username){err.textContent='Rellena la familia, el titular y su usuario.';return}
    try{const r=await api('admin/op',{method:'POST',admin:true,body:{op:'createAccount',name:acc}});
      await api('admin/op',{method:'POST',admin:true,body:{op:'createUser',accountId:r.account.id,username,name,password,role:'owner'}});
      A.creds={name,username,password};A.open[r.account.id]=true;toast('Familia creada');await adminLoad();window.scrollTo(0,0)}
    catch(x){err.textContent=x.message}return}
  if(f.classList.contains('a-user')){const F=new FormData(f);const body={accountId:f.dataset.acc,name:String(F.get('name')||'').trim(),username:String(F.get('username')||'').trim().toLowerCase(),role:F.get('role'),password:String(F.get('password')||'')};
    const r=await aop('createUser',body,'Usuario creado');if(r){A.creds={name:body.name,username:body.username,password:body.password};render();window.scrollTo(0,0)}return}
  if(f.classList.contains('a-pay')){const F=new FormData(f);const from=fromDateInput(F.get('from'))??Date.now(),u=F.get('until')?fromDateInput(F.get('until'))+DAY-1:null;
    await aop('activate',{accountId:f.dataset.acc,module:F.get('module'),from,until:u,amount:+(F.get('amount')||0),kind:F.get('kind'),note:F.get('note')},'Pago registrado');return}
  if(f.id==='a-cfg'){const F=new FormData(f);await aop('setConfig',{bizum:F.get('bizum'),bizumName:F.get('bizumName'),payText:F.get('payText'),prices:{module:+F.get('pm'),all:+F.get('pa')},trialDays:+F.get('td')},'Ajustes guardados');return}
  if(f.id==='a-renform'){await aop('updateAccount',{id:f.dataset.acc,name:val('a-ren')},'Nombre cambiado');closeSheet();return}
  if(f.id==='a-migrate'){const r=await aop('migrateLegacy',{name:val('a-mname')});if(r){toast(`Migrados ${r.events} registros y ${r.notes} notas`);A.open[r.account.id]=true;render()}return}
});
document.addEventListener('focusout',()=>{setTimeout(()=>{if(ui.dirty&&!busyEditing())refresh()},0)});
document.addEventListener('change',e=>{const t=e.target;
  if(t.dataset.actChange==='a-role')return aop('updateUser',{id:t.dataset.id,role:t.value},'Rol cambiado');
  if(t.dataset.actChange==='a-umod')return aop('setUserMod',{id:t.dataset.id,module:t.dataset.mod,value:t.value},'Ajuste guardado');
  if(t.name==='mode'){ui.mode=t.value;render()}
  else if(t.name==='period'){ui.period=+t.value;ui.sel={};render()}
  else if(t.id==='daypick'){const d=fromDateInput(t.value);if(d&&d<=midnight(Date.now())){ui.day=d;render()}}
  else if(t.id==='p-ns'&&t.value){setSetting('nightStart',t.value)}
  else if(t.id==='p-ne'&&t.value){setSetting('nightEnd',t.value)}
  else if(t.name==='theme'){D.theme=t.value;saveD();applyTheme();render()}
  else if(t.id==='imp-file'&&t.files&&t.files[0]){const r=new FileReader();r.onload=()=>parseImport(String(r.result));r.readAsText(t.files[0])}
  else if(t.id==='f-title'){const w=$('#f-other-w');if(w)w.hidden=t.value!=='__otro'}
  else if(t.id==='f-photo'&&t.files&&t.files[0]){pickPhoto(t.files[0])}
});
window.addEventListener('hashchange',route);
setInterval(()=>{tickClocks()},1000);
setInterval(()=>{if(!ADMIN&&D.token&&!tour&&$('#sheet').hidden&&$('#report').hidden&&!busyEditing()&&(ui.view==='inicio'||ui.view==='diario'))render();else renderSync()},30000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&S&&D.token&&!ADMIN){sy.fail=0;sync();loop();if(!tour&&$('#sheet').hidden&&$('#report').hidden&&!busyEditing())render()}});
window.addEventListener('online',()=>{if(S&&D.token){sy.fail=0;sync()}});

/* ---------- Arranque ---------- */
(async()=>{
  S=await load();
  if(!S||S.v!==3)S=blank();
  S.settings=Object.assign(defaultSettings(),S.settings||{});['events','notes','babies','outbox'].forEach(k=>{S[k]=S[k]||[]});if(typeof S.rev!=='number')S.rev=-1;
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  applyTheme();
  if(ADMIN){document.title='Administración · Diario del bebé';render();if(D.adminToken)adminLoad();}
  else{route();if(D.token){sync();loop();if(!D.tourSeen&&curBaby()&&!me()?.user?.mustChange)setTimeout(startTour,600)}}
  if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('/sw.js').catch(()=>{})}
})();
})();

</script>
</body>
</html>
